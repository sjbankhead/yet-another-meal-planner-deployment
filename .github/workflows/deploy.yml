# Deploy the yamp Worker AND publish your plugin marketplace. The deploy
# logic is a reusable workflow in the code repo — TEMPORARILY pointed at the fork
# sjbankhead/yet-another-meal-planner (test date-drift workaround; issue #296).
# Revert to caseyWebb/yet-another-meal-planner once upstream fixes the test.
# This thin caller overlays THIS repo's wrangler.jsonc onto the source, deploys,
# then builds the plugin with YOUR connector URL baked in and commits it to this
# repo (your marketplace). It runs in THIS repo with this repo's CLOUDFLARE_API_TOKEN
# — the public code repo holds no secrets. Pin @main to a release tag if you prefer
# stability over auto-updates.
name: Deploy Worker

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# contents: write so the deploy can pin auto-provisioned KV/D1 ids back into this
# repo's wrangler.jsonc on first deploy AND publish the plugin bundle to this repo.
permissions:
  contents: write

jobs:
  deploy:
    uses: sjbankhead/yet-another-meal-planner/.github/workflows/data-deploy.yml@main
    # NOTE: secrets: inherit only works within the same org/enterprise. The reusable
    # workflow lives in a different account, so secrets MUST be passed explicitly.
    # CLOUDFLARE_API_TOKEN is required; KROGER_* are optional (the deploy sets them as
    # Worker secrets when present).
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
    with:
      config_path: wrangler.jsonc
      # Your connector host (e.g. yamp.<you>.workers.dev). The deploy bakes
      # https://<WORKER_HOST>/mcp into the published plugin and stamps the README badge.
      worker_host: ${{ vars.WORKER_HOST }}
